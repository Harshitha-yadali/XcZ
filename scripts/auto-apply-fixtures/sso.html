<!doctype html>
<meta charset="utf-8">
<title>Fixture</title>
<!--
  A stand-in for an employer that only takes applications from a signed-in
  account, for scripts/auto-apply-selftest.mjs. It copies the flow seen on
  IBM's careers site: a job posting with "Apply now", then a sign-in on a
  second address that asks for the account name first and the password on the
  next page, then the application form.

  ?view=job|login|password|code picks the page. idp= and home= are the
  addresses of the sign-in pages and of the careers site. mfa=1 adds a
  verification-code page after the password. Everything typed into the
  sign-in pages is posted to /record, where the self-test reads it back.
-->
<main id="root"></main>
<script>
  const params = new URLSearchParams(location.search);
  const view = params.get('view') || 'job';
  const idp = params.get('idp') || location.host;
  const home = params.get('home') || location.host;
  const carry = `idp=${encodeURIComponent(idp)}&home=${encodeURIComponent(home)}${params.has('mfa') ? '&mfa=1' : ''}`
    + (params.has('to') ? `&to=${encodeURIComponent(params.get('to'))}` : '');
  const root = document.getElementById('root');
  const record = (entry) => fetch('/record', { method: 'POST', body: JSON.stringify({ host: location.hostname, ...entry }) });
  const complain = (problem) => { document.getElementById('problem').innerHTML = `<div role="alert">${problem}</div>`; };

  if (view === 'job') {
    document.title = 'Associate Engineer - Example Careers';
    root.innerHTML = '<h1>Associate Engineer</h1><a id="apply">Apply now</a><p>Introduction. Your role and responsibilities.</p>';
    // ?next= picks what the Apply link leads to: the identifier page by
    // default, or the provider chooser some sign-ins open with.
    document.getElementById('apply').href = `http://${idp}/sso.html?view=${params.get('next') || 'login'}&${carry}`;
  }

  // Workday opens its sign-in on a row of providers with nothing to type yet.
  // Only the site's own email sign-in may be opened; the rest hand the user to
  // someone else's login, where their password is not ours to type.
  if (view === 'providers') {
    document.title = 'Sign In';
    root.innerHTML = `
      <h1>Sign In</h1>
      <button type="button" id="apple">Sign in with Apple</button>
      <button type="button" id="google">Sign in with Google</button>
      <button type="button" id="email">Sign in with email</button>
      <div id="problem"></div>`;
    for (const other of ['apple', 'google']) {
      document.getElementById(other).addEventListener('click', () => record({ step: 'provider', value: other }));
    }
    document.getElementById('email').addEventListener('click', () => {
      location.href = `sso.html?view=password&${carry}`;
    });
  }

  // The same chooser with its email sign-in taken away: every way in belongs
  // to someone else. There is nothing here we may press, so the run has to say
  // which provider the site insists on rather than report a missing form.
  if (view === 'providers-only') {
    document.title = 'Sign In';
    root.innerHTML = `
      <h1>Sign In</h1>
      <button type="button" id="google">Continue with Google</button>
      <button type="button" id="apple">Sign in with Apple</button>
      <div id="problem"></div>`;
    for (const other of ['google', 'apple']) {
      document.getElementById(other).addEventListener('click', () => record({ step: 'provider', value: other }));
    }
  }

  // A page that sends the applicant somewhere nothing linked to. The job page
  // vouched for this address, not for whatever it forwards to next.
  if (view === 'bounce') {
    document.title = 'Redirecting';
    root.innerHTML = '<p>One moment.</p>';
    location.href = `http://${params.get('to')}/sso.html?view=password&${carry}`;
  }

  if (view === 'login') {
    document.title = 'ExampleID - Sign in or create an ExampleID';
    root.innerHTML = `
      <form id="signin">
        <input type="hidden" name="password">
        <label for="username">ExampleID</label>
        <input id="username" name="username" type="text">
        <button type="submit" id="continue-button">Continue</button>
        <label><input type="checkbox" name="remember">Remember me</label>
        <div id="problem"></div>
      </form>`;
    document.getElementById('signin').addEventListener('submit', async (event) => {
      event.preventDefault();
      const value = document.getElementById('username').value;
      await record({ step: 'identifier', value });
      if (value !== 'asha@example.com') return complain('We could not find that ExampleID.');
      location.href = `sso.html?view=password&${carry}`;
    });
  }

  if (view === 'password') {
    document.title = 'ExampleID - Sign in';
    root.innerHTML = `
      <form id="signin">
        <p>asha@example.com</p>
        <label for="secret">Password</label>
        <input id="secret" name="password" type="password">
        <button type="submit">Log in</button>
        <div id="problem"></div>
      </form>`;
    document.getElementById('signin').addEventListener('submit', async (event) => {
      event.preventDefault();
      const value = document.getElementById('secret').value;
      await record({ step: 'password', value });
      if (value !== 'correct horse') return complain('Incorrect password.');
      location.href = params.has('mfa') ? `sso.html?view=code&${carry}` : `http://${home}/single.html`;
    });
  }

  // A site with no account for this applicant yet. Two password boxes make it
  // a registration form; a term that must be accepted stands beside a mailing
  // list that must be left alone.
  if (view === 'signup') {
    document.title = 'Create your account';
    root.innerHTML = `
      <h1>Create your account</h1>
      <form id="register">
        <label for="email">Email</label><input id="email" name="email" type="text">
        <label for="first">First name</label><input id="first" name="first_name" type="text">
        <label for="last">Last name</label><input id="last" name="last_name" type="text">
        <label for="secret">Password</label><input id="secret" name="password" type="password">
        <label for="again">Confirm password</label><input id="again" name="confirm" type="password">
        <label><input name="terms" type="checkbox" required> I accept the terms</label>
        <label><input name="news" type="checkbox"> Email me similar jobs</label>
        <button type="submit">Create account</button>
        <div id="problem"></div>
      </form>`;
    document.getElementById('register').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = new FormData(event.target);
      await record({
        step: 'signup',
        value: form.get('email'),
        matched: form.get('confirm') === form.get('password') && String(form.get('password') || '').length >= 12,
        name: `${form.get('first_name')} ${form.get('last_name')}`.trim(),
        terms: form.get('terms') === 'on',
        news: form.get('news') === 'on',
      });
      location.href = `http://${home}/single.html`;
    });
  }

  if (view === 'code') {
    document.title = 'ExampleID - Verify it is you';
    root.innerHTML = '<p>Enter the verification code we sent to your email.</p><input name="otp" type="text"><button type="button">Verify</button>';
    root.querySelector('button').addEventListener('click', async () => {
      const otp = root.querySelector('input').value;
      await record({ step: 'code', value: otp });
      if (otp === '482913') location.href = `http://${home}/single.html`;
    });
  }
</script>
